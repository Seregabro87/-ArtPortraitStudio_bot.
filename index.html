<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформить заказ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #333);
            padding: 15px;
            margin: 0;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: var(--tg-theme-button-color, #0088cc); margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 12px; margin-bottom: 5px; }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .price {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            color: #27ae60;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎨 Заказ портрета</h2>
        
        <label for="style">Стиль портрета:</label>
        <select id="style">
            <option value="Масло">🎨 Живопись маслом</option>
            <option value="Акварель">🖌️ Акварель</option>
            <option value="Digital Art">💻 Digital Art / Цифровой</option>
            <option value="Карандаш">✏️ Графика / Карандаш</option>
        </select>

        <label for="size">Размер холста:</label>
        <select id="size" onchange="calculatePrice()">
            <option value="30x40" data-price="2500">30 x 40 см — 2 500 ₽</option>
            <option value="40x60" data-price="3500">40 x 60 см — 3 500 ₽</option>
            <option value="50x70" data-price="4500">50 x 70 см — 4 500 ₽</option>
            <option value="60x80" data-price="6000">60 x 80 см — 6 000 ₽</option>
        </select>

        <label for="phone">Ваш номер телефона / Telegram:</label>
        <input type="text" id="phone" placeholder="+7 (999) 000-00-00">

        <div class="price" id="totalPrice">Итого: 2 500 ₽</div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;

        if (tg) {
            tg.ready();
            tg.expand();

            // Настраиваем встроенную кнопку Telegram внизу экрана
            tg.MainButton.setText("ОФОРМИТЬ ЗАКАЗ");
            tg.MainButton.show();

            tg.MainButton.onClick(function() {
                let style = document.getElementById('style').value;
                let size = document.getElementById('size').value;
                let phone = document.getElementById('phone').value;
                let price = document.getElementById('totalPrice').innerText;

                if (!phone.trim()) {
                    alert('Пожалуйста, укажите ваш номер телефона или контакт для связи.');
                    return;
                }

                let data = {
                    style: style,
                    size: size,
                    phone: phone,
                    price: price
                };

                try {
                    tg.sendData(JSON.stringify(data));
                } catch (e) {
                    alert('Пожалуйста, отправьте команду /start боту и откройте форму из сообщения.');
                }
            });
        }

        function calculatePrice() {
            let sizeSelect = document.getElementById('size');
            let price = sizeSelect.options[sizeSelect.selectedIndex].getAttribute('data-price');
            document.getElementById('totalPrice').innerText = 'Итого: ' + Number(price).toLocaleString('ru-RU') + ' ₽';
        }
    </script>
</body>
</html>
